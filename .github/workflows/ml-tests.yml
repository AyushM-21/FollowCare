name: ML tests

on:
  push:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-tests.yml"]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Python tests (synthetic data only)
        run: python -m pytest ml -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node client tests
        run: node --test ml/node-client/mlClient.test.mjs

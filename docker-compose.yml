# Local infrastructure for FollowCare. Run the apps with `npm run dev` (see README.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: followcare
      POSTGRES_PASSWORD: followcare
      POSTGRES_DB: followcare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followcare"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
